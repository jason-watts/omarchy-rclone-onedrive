# Historical note: older units bound HTTP RC on 127.0.0.1:5572 with --rc-no-auth.
# Current jason-watts.rclone-onedrive units listen on a per-user unix socket instead:
#
#   --rc --rc-addr unix://${XDG_RUNTIME_DIR}/omarchy-rclone-onedrive.sock
#
# Query it with:
#   rclone rc --unix-socket "$XDG_RUNTIME_DIR/omarchy-rclone-onedrive.sock" core/stats
#
# Do not add --rc-no-auth. Other local users cannot reach $XDG_RUNTIME_DIR (mode 700).
