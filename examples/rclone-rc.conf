# Drop-in that adds rclone RC on localhost so the widget can show live transfers.
# Install (system unit example):
#   sudo mkdir -p /etc/systemd/system/rclone-onedrive.service.d
#   sudo install -m 644 rclone-rc.conf /etc/systemd/system/rclone-onedrive.service.d/rc.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart rclone-onedrive.service
#
# Replace ExecStart with your real rclone mount line, then add:
#   --rc --rc-addr 127.0.0.1:5572 --rc-no-auth

[Service]
ExecStart=
ExecStart=/usr/bin/rclone mount REMOTE: /path/to/mount --vfs-cache-mode full --log-level INFO --rc --rc-addr 127.0.0.1:5572 --rc-no-auth
